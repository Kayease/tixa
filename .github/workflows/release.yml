name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate tag and VERSION
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < VERSION)"
          actual="${GITHUB_REF_NAME}"
          if [ "$actual" != "$expected" ]; then
            echo "Tag $actual does not match VERSION ($expected)" >&2
            exit 1
          fi
          bash -n bootstrap.sh install.sh cli/tixa core/*.sh
          python3 -m py_compile templates/main.py

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Tixa $GITHUB_REF_NAME"
